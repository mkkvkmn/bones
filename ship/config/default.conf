# Any other host name, or the bare IP, gets no site: the connection is closed (444) or the
# TLS handshake is refused, so scanners never see a real site or certificate.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
