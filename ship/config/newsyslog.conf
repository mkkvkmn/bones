# Installed by server/setup.sh as a marked block in /etc/newsyslog.conf (OpenBSD has no newsyslog.d).
# access.log and error.log hold visitor IP addresses (for security): keep 14 days. stats.log has
# no IP addresses (visitor stats, see stats.py): keep 400 days. SIGUSR1 makes nginx reopen its
# logs; OpenBSD newsyslog takes only the signal name here (a number makes it skip the line).
/var/log/nginx/access.log   root:wheel  640  14   *     @T00  Z  /var/run/nginx.pid  SIGUSR1
/var/log/nginx/error.log    root:wheel  640  14   *     @T00  Z  /var/run/nginx.pid  SIGUSR1
/var/log/nginx/stats.log    root:wheel  640  400  *     @T00  Z  /var/run/nginx.pid  SIGUSR1
/var/log/ship/monitor.log   root:wheel  640  5   1000  *     Z
