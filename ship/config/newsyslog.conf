# Installed by server/setup.sh as a marked block in /etc/newsyslog.conf (OpenBSD has no newsyslog.d).
# nginx logs hold visitor IP addresses: keep 14 days. Signal 30 = SIGUSR1: nginx reopens its logs.
/var/log/nginx/access.log   root:wheel  640  14  *     @T00  Z  /var/run/nginx.pid  30
/var/log/nginx/error.log    root:wheel  640  14  *     @T00  Z  /var/run/nginx.pid  30
/var/log/ship/monitor.log   root:wheel  640  5   1000  *     Z
