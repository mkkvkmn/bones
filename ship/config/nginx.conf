# /etc/nginx/nginx.conf (server/setup.sh). Per-site servers live in /etc/nginx/ship/*.conf.
user www;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;
# rc.d starts nginx in the "daemon" login class: openfiles-cur=128. That is far below
# worker_connections, so one scanner with ~120 open connections made accept() and open() fail
# (EMFILE, HTTP 500). The worker sets this limit as root before it drops to www. Each connection
# can take 2 descriptors (client + isso upstream) plus a file; keep it under kern.maxfiles.
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log /var/log/nginx/access.log combined;
    # Visitor stats without personal data (read by ship/stats.py, kept 400 days). A line holds:
    # host, time to the hour, method and path (no query string), status, size, the referring
    # site's host (the path only when the link is on this site), a reduced agent, the first
    # language, and Sec-Fetch-Dest ("document" when a browser opens a page; most bots send
    # nothing). No IP address. The agent is reduced to: browser family, major version and mobile
    # or desktop for browsers; the name alone for bots, scripts and feed readers (their agents
    # can hold a person's own address), plus the subscriber count a feed service reports.
    map $http_accept_language $stats_lang {
        "~^(?<stats_l>[A-Za-z]{2})" $stats_l;
        default -;
    }
    map $request_uri $stats_path {
        "~^(?<stats_p>[^?]*)" $stats_p;
    }
    map $http_user_agent $stats_browser {
        "~(?<stats_bf>Edg|OPR|Firefox|FxiOS|CriOS|Chrome|Version)/(?<stats_bv>\d+)" "$stats_bf/$stats_bv";
        default "";
    }
    map $http_user_agent $stats_device {
        "~Mobile|Android|iPhone|iPad" m;
        default d;
    }
    # The word in the agent that makes it a bot ("Googlebot", "HeadlessChrome"), and no more.
    map $http_user_agent $stats_bot_name {
        "~*(?<stats_bn>[A-Za-z0-9_-]*(?:bot|crawl|spider|slurp|scan|fetch|monitor|uptime|check|preview|feed|rss|reader|archive|python|curl|wget|http|java|headless|lighthouse|semrush|ahrefs|gpt|claude|perplexity)[A-Za-z0-9_-]*)" $stats_bn;
        default "";
    }
    map $http_user_agent $stats_subs {
        "~*(?<stats_sn>\d+) (?:subscribers?|readers?)" " $stats_sn subscribers";
        default "";
    }
    map $http_user_agent $stats_product {
        "~^(?<stats_pn>[A-Za-z][A-Za-z0-9_-]*)" $stats_pn;
        default -;
    }
    map $http_user_agent $stats_agent {
        "~*^Mozilla/.*(?:bot|crawl|spider|slurp|scan|fetch|monitor|uptime|check|preview|feed|rss|reader|archive|python|curl|wget|http|java|headless|lighthouse|semrush|ahrefs|gpt|claude|perplexity)" "$stats_bot_name$stats_subs";
        "~^Mozilla/5\.0 \(" "$stats_browser $stats_device";
        default "$stats_product$stats_subs";
    }
    # The time to the hour: a request cannot be matched to a comment's public time stamp.
    map $time_local $stats_time {
        "~^(?<stats_th>[^:]+:\d\d):\d\d:\d\d (?<stats_tz>.+)$" "$stats_th:00:00 $stats_tz";
    }
    map $http_referer $stats_ref_host {
        "~^https?://(?<stats_rh>[^/:?#]+)" $stats_rh;
        default -;
    }
    map $http_referer $stats_ref_path {
        "~^https?://[^/?#]+(?<stats_rp>/[^?#]*)" $stats_rp;
        default "";
    }
    map "$host $stats_ref_host" $stats_ref {
        "~^(\S+) \1$" "$stats_ref_host$stats_ref_path";
        default $stats_ref_host;
    }
    log_format stats '$host [$stats_time] "$request_method $stats_path" $status $body_bytes_sent '
                     '"$stats_ref" "$stats_agent" $stats_lang $http_sec_fetch_dest';
    access_log /var/log/nginx/stats.log stats;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    # Static sites + small comment posts only: keep requests small and slow clients short.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/atom+xml application/javascript application/json image/svg+xml;

    # Mozilla "intermediate": TLS 1.2 + 1.3.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Per-IP limits: page requests, and comment writes (GET/HEAD/OPTIONS are not counted).
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    map $request_method $isso_write_key {
        GET     "";
        HEAD    "";
        OPTIONS "";
        default $binary_remote_addr;
    }
    limit_req_zone $isso_write_key zone=isso_write:1m rate=6r/m;
    limit_req_status 429;

    include /etc/nginx/ship/*.conf;
}
