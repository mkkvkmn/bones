# /etc/nginx/nginx.conf (server/setup.sh). Per-site servers live in /etc/nginx/ship/*.conf.
user www;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    access_log /var/log/nginx/access.log combined;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    server_tokens off;

    # Static sites + small comment posts only: keep requests small and slow clients short.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/xml application/rss+xml application/atom+xml application/javascript application/json image/svg+xml;

    # Mozilla "intermediate": TLS 1.2 + 1.3 (same as core/ship).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Per-IP limits: page requests, and comment writes (GET/HEAD/OPTIONS are not counted).
    limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
    map $request_method $isso_write_key {
        GET     "";
        HEAD    "";
        OPTIONS "";
        default $binary_remote_addr;
    }
    limit_req_zone $isso_write_key zone=isso_write:1m rate=6r/m;
    limit_req_status 429;

    include /etc/nginx/ship/*.conf;
}
