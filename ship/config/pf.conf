# pf for a bones/ship web server (installed as /etc/pf.conf by server/setup.sh).
# Only ssh, http, https and ping get in. ssh is rate limited: an address that opens more than
# 30 ssh connections in 60 s (password guessing bots open hundreds) goes into <bruteforce>.
# That only blocks its ssh, never the websites, and entries expire after an hour (cron).
# The deploy scripts open many short ssh connections, so the limit must stay well above that.

set skip on lo
set block-policy drop
set loginterface egress

table <bruteforce> persist

block all
antispoof quick for egress inet
block in quick proto tcp from <bruteforce> to (egress) port ssh

pass out quick inet
pass out quick inet6

pass in on egress inet proto tcp to (egress) port ssh flags S/SA keep state \
    (max-src-conn 20, max-src-conn-rate 30/60, overload <bruteforce> flush)
pass in on egress inet proto tcp to (egress) port { http https } flags S/SA keep state
pass in on egress inet proto icmp icmp-type echoreq
pass inet6 proto ipv6-icmp
